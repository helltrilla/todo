name: Build & Publish Release (Android & iOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Android Release APK & AppBundle
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          flutter build apk --release
          flutter build appbundle --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/TodoApp-${TAG}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/TodoApp-${TAG}-android.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*

  build-ios:
    name: Build iOS Unsigned IPA & Simulator App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign) & Package IPA
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          flutter build ios --release --no-codesign
          mkdir -p Payload dist
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q "dist/TodoApp-${TAG}-ios-unsigned.ipa" Payload
          rm -rf Payload

          flutter build ios --simulator
          cd build/ios/iphonesimulator
          zip -r -q "../../../dist/TodoApp-${TAG}-ios-simulator.zip" Runner.app

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: dist/*

  build-web:
    name: Build Web Release Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web Release
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          flutter build web --release
          mkdir -p dist
          cd build/web
          zip -r -q "../../dist/TodoApp-${TAG}-web.zip" .
          cd ../..

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: dist/*

  publish-release:
    name: Create GitHub Release
    needs: [build-android, build-ios, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "TodoApp ${{ github.event.inputs.tag_name || github.ref_name }}"
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## TodoApp ${{ github.event.inputs.tag_name || github.ref_name }} — Major 2.0 Architecture & Intelligence Update

            ### Новое в релизе 2.0.0 / What's New (Русский)
            - **🤖 AI Daily Digest (Google Gemini 2.0 Flash)**:
              - Персонализированный утренний бриф дня: анализ задач, выделение топ-фокуса и рекомендация слота продуктивности.
              - Кэширование генерации раз в сутки с fallback на вдохновляющие цитаты при отсутствии задач.
            - **🎯 Интерактивная Матрица Эйзенхауэра 2x2 (Drag-and-Drop)**:
              - Распределение задач по 4 квадрантам матрицы: Срочно/Важно, Важно/Не срочно, Срочно/Не важно, Не срочно/Не важно.
              - Перетаскивание задач между квадрантами с мгновенным обновлением приоритетов.
            - **⚡ Нативные шорткаты Siri и Android (Deep Links)**:
              - Запуск быстрых действий с домашнего экрана (Quick Actions) и голосовых команд через схему `todoapp://add-task`.
            - **🏛️ Полный переход на Clean Architecture & Centralized DI**:
              - Сборка графа зависимостей через выделенный типизированный контейнер `AppDependencies`.
              - Ликвидация антипаттерна «God Object» с декомпозицией на `TaskController`, `PomodoroController`, `SyncController` и `ThemeController`.
            - **🔔 Рефакторинг NotificationService под чистый DI**:
              - Полная замена глобального синглтона на интерфейс `INotificationService` с открытым конструктором и поддержкой моков для 100% тестируемости.
            - **🔒 Защита конфигурации и секретов**:
              - Устранение захардкоженных ключей в коде: загрузка кредов через `.env` файл и `--dart-define-from-file=.env`.
            - **🔋 Оптимизация энергопотребления Focus Hub**:
              - Отказ от таймеров поллинга в UI, переход на реактивный событийный `MediaPlaybackService`.
            - **🌐 Мультиязычная локализация (5 языков)**:
              - Поддержка **🇷🇺 Русский**, **🇬🇧 English**, **🇩🇪 Deutsch**, **🇫🇷 Français** и **🇷🇸 Српски** с переключением на лету.
            - **🎨 4 темы оформления**: Тёмная, Светлая, Midnight (AMOLED #000000), Системная.
            - **☁️ Облачная синхронизация Supabase (Offline-First)** с защитой от потери данных.

            #### Файлы для скачивания:
            - **Android (`.apk`)**: `TodoApp-*-android.apk` — готовый установочный файл для любого Android-устройства.
            - **Android (`.aab`)**: `TodoApp-*-android.aab` — пакет для публикации в Google Play.
            - **Web (`.zip`)**: `TodoApp-*-web.zip` — готовый веб-бандл (PWA) для развертывания на любом сервере/хостинге.
            - **iOS (`.ipa`)**: `TodoApp-*-ios-unsigned.ipa` — неподписанный IPA для установки на iPhone.
            - **iOS Simulator (`.zip`)**: `TodoApp-*-ios-simulator.zip` — сборка для запуска в симуляторе iOS на macOS.

            ---

            ### Release Highlights (English)
            - **🤖 AI Daily Digest (Gemini 2.0 Flash)**: Automated smart morning briefing highlighting day's top focus and peak productivity window.
            - **🎯 Interactive 2x2 Eisenhower Matrix**: Priority matrix with drag-and-drop reassignment and seamless list-view switching.
            - **⚡ Siri & Android Assistant Shortcuts**: Native deep link URI navigation and quick action launching.
            - **🏛️ Clean Architecture & Typed DI**: Feature-based dependency locator replacing god objects with fine-grained SRP controllers.
            - **🔔 Pure DI Notification Service**: Abstract `INotificationService` decoupling native channels for deterministic test doubles.
            - **🔒 Configuration Security**: Zero hardcoded keys in git, clean `.env` secret injection via `--dart-define-from-file`.
            - **🔋 Battery-Efficient Audio**: Event-driven `MediaPlaybackService` eliminating background poll timers.
            - **🌐 5 Locales & 4 Themes**: Russian, English, German, French, Serbian; Dark, Light, AMOLED Midnight, and System.
            - **🌐 Multi-Language Localization (5 Locales)**:
              - Native localization for **🇷🇺 Russian**, **🇬🇧 English**, **🇩🇪 German**, **🇫🇷 French**, and **🇷🇸 Serbian**.
              - Instant runtime language switching from Settings without requiring an app restart.
              - Context-aware pluralization rules for each locale.
            - **🎨 4 Theme Modes**:
              - **🌙 Dark**: Listodo signature dark interface.
              - **☀️ Light**: High-contrast daylight theme.
              - **🖤 Midnight (AMOLED)**: Deep pure black (`#000000`) optimized for OLED battery efficiency.
              - **⚙️ System**: Automatically adapts to device system appearance.
            - **🎧 Focus Ambient Studio & Music Hub**:
              - 4 procedural ambient soundscapes: **🌧️ Rain**, **🌊 Ocean Waves**, **☕ Cozy Cafe**, **💿 Vinyl Player**.
              - Dual-channel audio mixer with granular volume sliders.
              - Custom playlist hub (Spotify, Apple Music, Yandex Music, YouTube Music, VK) with automated cover art retrieval and gallery photo uploads.
              - Smooth, lag-free lock screen and Control Center media playback integration (Now Playing).
