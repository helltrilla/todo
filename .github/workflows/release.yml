name: Build & Publish Release (Android & iOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Android Release APK & AppBundle
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          flutter build apk --release
          flutter build appbundle --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/TodoApp-${TAG}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/TodoApp-${TAG}-android.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*

  build-ios:
    name: Build iOS Unsigned IPA & Simulator App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign) & Package IPA
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          flutter build ios --release --no-codesign
          mkdir -p Payload dist
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q "dist/TodoApp-${TAG}-ios-unsigned.ipa" Payload
          rm -rf Payload

          flutter build ios --simulator
          cd build/ios/iphonesimulator
          zip -r -q "../../../dist/TodoApp-${TAG}-ios-simulator.zip" Runner.app

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: dist/*

  build-web:
    name: Build Web Release Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web Release
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          flutter build web --release
          mkdir -p dist
          cd build/web
          zip -r -q "../../dist/TodoApp-${TAG}-web.zip" .
          cd ../..

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: dist/*

  publish-release:
    name: Create GitHub Release
    needs: [build-android, build-ios, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "TodoApp ${{ github.event.inputs.tag_name || github.ref_name }}"
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## TodoApp ${{ github.event.inputs.tag_name || github.ref_name }}

            ### Новое в этом релизе / What's New (Русский)
            - **🌐 Мультиязычная локализация (5 языков)**:
              - Добавлена полноценная локализация на 5 языков: **🇷🇺 Русский**, **🇬🇧 English**, **🇩🇪 Deutsch**, **🇫🇷 Français** и **🇷🇸 Српски**.
              - Переключение языка на лету прямо в меню Настроек через удобную шторку с флагами государств.
              - Честная поддержка контекстных грамматических форм числительных для каждого языка.
              - Сохранение выбранного языка в памяти устройства (`SharedPreferences`).
            - **🎨 4 темы оформления приложения**:
              - **🌙 Тёмная (Dark)**: стильная фирменная палитра Listodo UI.
              - **☀️ Светлая (Light)**: яркий, контрастный и чистый дневной интерфейс.
              - **🖤 Midnight (AMOLED)**: ультраглубокий чёрный цвет (`#000000`) для экономии заряда аккумулятора на OLED/AMOLED дисплеях.
              - **⚙️ Системная (System)**: динамическое следование за системной темой iOS/Android.
            - **☁️ Облачная синхронизация Supabase (Offline-First)**:
              - Двусторонняя синхронизация задач через Supabase PostgREST и Row Level Security (RLS).
              - Разрешение конфликтов Last-Write-Wins (LWW).
            - **💻 Поддержка Web (PWA & Desktop-friendly)**:
              - Адаптивный центрированный макет для широких экранов и мониторов.
              - Темный сплэш-экран загрузки и PWA-манифест.
            - **🎧 Студия концентрации и эмбиент-шумы (Focus Audio Studio)**:
              - 4 встроенных аппаратных генератора атмосферных шумов: **🌧️ Дождь**, **🌊 Океанский прибой**, **☕ Уютное кафе**, **💿 Виниловый проигрыватель**.
              - Двухканальный аудиомикшер с раздельными ползунками громкости для фоновой атмосферы и системного звука.
              - Музыкальный хаб с кастомными плейлистами пользователя (Spotify, Apple Music, Яндекс Музыка, YouTube Music, VK Музыка).

            #### Файлы для скачивания:
            - **Android (`.apk`)**: `TodoApp-*-android.apk` — готовый установочный файл для любого Android-устройства.
            - **Android (`.aab`)**: `TodoApp-*-android.aab` — пакет для публикации в Google Play.
            - **Web (`.zip`)**: `TodoApp-*-web.zip` — готовый веб-бандл (PWA) для развертывания на любом сервере/хостинге.
            - **iOS (`.ipa`)**: `TodoApp-*-ios-unsigned.ipa` — неподписанный IPA для установки на iPhone.
            - **iOS Simulator (`.zip`)**: `TodoApp-*-ios-simulator.zip` — сборка для запуска в симуляторе iOS на macOS.

            ---

            ### Release Highlights (English)
            - **🌐 Multi-Language Localization (5 Locales)**:
              - Native localization for **🇷🇺 Russian**, **🇬🇧 English**, **🇩🇪 German**, **🇫🇷 French**, and **🇷🇸 Serbian**.
              - Instant runtime language switching from Settings without requiring an app restart.
              - Context-aware pluralization rules for each locale.
            - **🎨 4 Theme Modes**:
              - **🌙 Dark**: Listodo signature dark interface.
              - **☀️ Light**: High-contrast daylight theme.
              - **🖤 Midnight (AMOLED)**: Deep pure black (`#000000`) optimized for OLED battery efficiency.
              - **⚙️ System**: Automatically adapts to device system appearance.
            - **🎧 Focus Ambient Studio & Music Hub**:
              - 4 procedural ambient soundscapes: **🌧️ Rain**, **🌊 Ocean Waves**, **☕ Cozy Cafe**, **💿 Vinyl Player**.
              - Dual-channel audio mixer with granular volume sliders.
              - Custom playlist hub (Spotify, Apple Music, Yandex Music, YouTube Music, VK) with automated cover art retrieval and gallery photo uploads.
              - Smooth, lag-free lock screen and Control Center media playback integration (Now Playing).
