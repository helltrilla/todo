name: Build & Publish Release (Android & iOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Android Release APK & AppBundle
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          flutter build apk --release
          flutter build appbundle --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/TodoApp-${TAG}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/TodoApp-${TAG}-android.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*

  build-ios:
    name: Build iOS Unsigned IPA & Simulator App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign) & Package IPA
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          flutter build ios --release --no-codesign
          mkdir -p Payload dist
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q "dist/TodoApp-${TAG}-ios-unsigned.ipa" Payload
          rm -rf Payload

          flutter build ios --simulator
          cd build/ios/iphonesimulator
          zip -r -q "../../../dist/TodoApp-${TAG}-ios-simulator.zip" Runner.app

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: dist/*

  build-web:
    name: Build Web Release Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web Release
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          flutter build web --release
          mkdir -p dist
          cd build/web
          zip -r -q "../../dist/TodoApp-${TAG}-web.zip" .
          cd ../..

      - name: Upload Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: dist/*

  publish-release:
    name: Create GitHub Release
    needs: [build-android, build-ios, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "TodoApp ${{ github.event.inputs.tag_name || github.ref_name }}"
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## TodoApp ${{ github.event.inputs.tag_name || github.ref_name }} — Light Theme Overhaul & Accent Color Palette System

            ### Новое в релизе 2.0.1 / What's New (Русский)
            - **☀️ Полный редизайн Светлой темы (Light Theme Redesign)**:
              - Радикальное повышение контрастности и читаемости интерфейса по гайдлайнам iOS и Material Design 3.
              - Ликвидация «слепого» белого текста на светлом фоне, блёклых рамок и инвертированных элементов.
              - Фоновый цвет `#F6F8FA`, контрастные белые карточки `#FFFFFF` с мягкими границами `#E5E7EB` и глубокий тёмный текст `#111827`.
              - Адаптивный GitHub Heatmap: пустые дни окрашены в `#EBEDF0` вместо черных квадратов, а активность нарастает фирменными зелеными оттенками вплоть до `#216E39`.
              - Pomodoro-таймер, Donut-чарт категорий, шторка добавления задачи, профиль и экраны авторизации адаптированы под светлое оформление.
            - **🎨 Палитра акцентных цветов (7 кураторских схем)**:
              - **Ирис (Iris)** — `#8875FF` + `#F5C26B` (фирменный фиолетовый с золотым).
              - **Океан (Ocean)** — `#2563EB` + `#38BDF8` (глубокий кобальт и небесный).
              - **Изумруд (Emerald)** — `#10B981` + `#FBBF24` (изумрудный с янтарным).
              - **Закат (Sunset)** — `#F97316` + `#FBBF24` (закатный оранжевый).
              - **Янтарь (Amber)** — `#F59E0B` + `#FB7185` (тёплый золотой с коралловым).
              - **Роза (Rose)** — `#EC4899` + `#A855F7` (фуксия с пурпурным).
              - **Индиго (Indigo)** — `#6366F1` + `#EC4899` (неоновый индиго с розовым).
            - **⚙️ Интерактивный селектор палитр в Настройках**:
              - Горизонтальный скролл с цветными образцами, активной галочкой и тактильным откликом (Haptics).
              - Мгновенная реактивная перерисовка UI без перезапуска приложения и сохранение в SharedPreferences.
            - **🏗️ Архитектура темы**:
              - Внедрение `ThemeExtension<AppThemeColors>` и динамического фасада `AppColors` для бесшовной синхронизации во всех режимах (Light, Dark, Midnight, System).
              - 129 автоматизированных тестов успешно пройдены (100% pass rate).

            #### Файлы для скачивания:
            - **Android (`.apk`)**: `TodoApp-*-android.apk` — готовый установочный файл для любого Android-устройства.
            - **Android (`.aab`)**: `TodoApp-*-android.aab` — пакет для публикации в Google Play.
            - **Web (`.zip`)**: `TodoApp-*-web.zip` — готовый веб-бандл (PWA) для развертывания на любом сервере/хостинге.
            - **iOS (`.ipa`)**: `TodoApp-*-ios-unsigned.ipa` — неподписанный IPA для установки на iPhone.
            - **iOS Simulator (`.zip`)**: `TodoApp-*-ios-simulator.zip` — сборка для запуска в симуляторе iOS на macOS.

            ---

            ### Release Highlights (English)
            - **☀️ Light Theme Complete Overhaul**:
              - High-contrast, clean daylight styling adhering to iOS Human Interface Guidelines and Material 3.
              - Elimination of low-contrast white-on-white text, invisible borders, and inverted components.
              - Crisp `#F6F8FA` background, pure white cards `#FFFFFF`, and high-contrast typography `#111827`.
              - GitHub Heatmap adaptive color scale (`#EBEDF0` -> `#216E39`).
            - **🎨 7 Curated Accent Color Palettes**:
              - Iris, Ocean, Emerald, Sunset, Amber, Rose, and Indigo accent schemes with Russian and English localization.
            - **⚙️ Interactive Settings Palette Picker**:
              - Horizontal swatch picker with active checkmarks and haptic feedback.
            - **🏗️ Clean Theme Architecture**:
              - `ThemeExtension<AppThemeColors>` integration and dynamic token facade synchronization.
              - 129 automated tests fully passing.
