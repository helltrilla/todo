name: Build & Publish Release (Android & iOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Android Release APK & AppBundle
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          flutter build apk --release
          flutter build appbundle --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/TodoApp-${TAG}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/TodoApp-${TAG}-android.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*

  build-ios:
    name: Build iOS Unsigned IPA & Simulator App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign) & Package IPA
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          flutter build ios --release --no-codesign
          mkdir -p Payload dist
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q "dist/TodoApp-${TAG}-ios-unsigned.ipa" Payload
          rm -rf Payload

          flutter build ios --simulator
          cd build/ios/iphonesimulator
          zip -r -q "../../../dist/TodoApp-${TAG}-ios-simulator.zip" Runner.app

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: dist/*

  publish-release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "TodoApp ${{ github.event.inputs.tag_name || github.ref_name }}"
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## TodoApp ${{ github.event.inputs.tag_name || github.ref_name }}

            ### Новое в этом релизе / What's New (Русский)
            - **🔔 Двойная система локальных Push-уведомлений (iOS & Android)**:
              - **Автоматическое оповещение в момент задачи**: срабатывает ровно в назначенное время задачи (`⏰ Время задачи: ...`).
              - **Настраиваемое предварительное напоминание**: при выборе даты и времени в календаре можно выбрать дополнительное оповещение заранее (`Только в момент`, `За 5 мин`, `За 15 мин`, `За 30 мин`, `За 1 час`, `За 1 день`).
              - **Автоматическая отмена**: при выполнении, архивации или удалении задачи её запланированные уведомления автоматически снимаются.
              - **Быстрый тест пушей**: в экране «Профиль и настройки» добавлена кнопка *«Проверить Push-уведомление»*.
            - **Готовность к сторам и приватность**:
              - Идентификатор приложения обновлён на `com.helltrilla.todoapp`.
              - Добавлены «Политика конфиденциальности» (`PRIVACY_POLICY.md`), лицензия MIT (`LICENSE`) и функция полного удаления аккаунта и данных в профиле.

            #### Файлы для скачивания:
            - **Android (`.apk`)**: `TodoApp-*-android.apk` — готовый установочный файл для любого Android-устройства.
            - **Android (`.aab`)**: `TodoApp-*-android.aab` — пакет для публикации в Google Play.
            - **iOS (`.ipa`)**: `TodoApp-*-ios-unsigned.ipa` — неподписанный IPA для установки на iPhone.
            - **iOS Simulator (`.zip`)**: `TodoApp-*-ios-simulator.zip` — сборка для запуска в симуляторе iOS на macOS.

            ---

            ### Release Highlights (English)
            - **🔔 Dual Local Push Notifications (iOS & Android)**:
              - **Automatic Due-Time Alert**: Fires automatically at the exact scheduled minute of the task (`⏰ Task Time: ...`).
              - **Configurable Advance Reminder**: Choose an advance reminder right inside the date & time picker (`At task time only`, `5 min before`, `15 min before`, `30 min before`, `1 hour before`, `1 day before`).
              - **Smart Cancellation**: Completing, archiving, or deleting a task automatically cancels its pending notifications.
              - **1-Tap Test Notification**: Added a *"Test Push Notification"* action in Profile & Settings.
            - **Store Readiness & Privacy**:
              - Updated bundle/application ID to `com.helltrilla.todoapp`, added `PRIVACY_POLICY.md`, MIT `LICENSE`, and in-app Account & Data Deletion.
