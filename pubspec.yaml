name: todo
description: "TodoApp — modern task manager with custom categories, subtasks, focus timer, Supabase OTP auth, offline-first cloud sync, and Web/PWA support."
publish_to: "none"
version: 1.5.1+9

environment:
  sdk: ^3.10.7

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/photo/
